<!DOCTYPE html>
<html lang="en" class="theme-dark dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LADAKH-SHIELD | High-Altitude Electronic System Monitoring &amp; Protection</title>
    <meta name="description" content="Universal Smart Module for monitoring and protecting electronic equipment in extreme high-altitude environments." />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ladakh_shield_theme');
          if (t === 'day' || t === 'light' || t === 'arctic-light') {
            document.documentElement.className = 'theme-day theme-light day light';
            document.documentElement.setAttribute('data-theme', 'day');
            document.documentElement.setAttribute('data-theme-mode', 'day');
          } else {
            document.documentElement.className = 'theme-night theme-dark night dark';
            document.documentElement.setAttribute('data-theme', 'night');
            document.documentElement.setAttribute('data-theme-mode', 'night');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#00D9FF] selection:text-[#07111F]" style="background-color: var(--bg-primary); color: var(--text-primary);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
